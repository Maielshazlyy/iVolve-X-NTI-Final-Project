name: Build, scan, and publish images

on:
  pull_request:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "app/auth-service/**"
      - "app/roadmap-service/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "app/auth-service/**"
      - "app/roadmap-service/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "335452653010"
  ECR_PREFIX: ivolve-x/dev

jobs:
  build-scan-publish:
    name: Build, scan, publish, and update Git manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker images
        run: |
          set -euo pipefail
          docker build -t frontend:${GITHUB_SHA} app/frontend
          docker build -t auth-service:${GITHUB_SHA} app/auth-service
          docker build -t roadmap-service:${GITHUB_SHA} app/roadmap-service

      - name: Scan built images with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan auth-service image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: auth-service:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan roadmap-service image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: roadmap-service:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable service images
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          for service in frontend auth-service roadmap-service; do
            repository="${registry}/${ECR_PREFIX}/${service}"
            image_tag="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
            docker tag "${service}:${GITHUB_SHA}" "${repository}:${image_tag}"
            docker push "${repository}:${image_tag}"
          done

      - name: Update Kubernetes image references for Argo CD
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for service in frontend auth-service roadmap-service; do
            manifest="kubernetes/base/${service}.yaml"
            repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_PREFIX}/${service}"
            image_tag="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
            sed -i -E "s#${repository}:[^[:space:]]+#${repository}:${image_tag}#" "$manifest"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/base/frontend.yaml kubernetes/base/auth-service.yaml kubernetes/base/roadmap-service.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deploy): update images to ${image_tag}"
            git push
          fi
