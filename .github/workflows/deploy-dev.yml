name: Deploy Dev to EKS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy application to EKS
    runs-on: [self-hosted, linux, x64]
    env:
      AWS_REGION: eu-north-1
      EKS_CLUSTER_NAME: ivolve-x-dev
      KUBERNETES_NAMESPACE: ivolve

    steps:
      - name: Check out deployment manifests
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Ensure application namespace exists
        run: kubectl create namespace "$KUBERNETES_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update application secrets
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          for name in MYSQL_ROOT_PASSWORD DB_USER DB_PASSWORD SESSION_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub secret $name is missing."
              exit 1
            fi
          done

          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"
          printf 'MYSQL_ROOT_PASSWORD=%s\nDB_USER=%s\nDB_PASSWORD=%s\nSESSION_SECRET=%s\n' \
            "$MYSQL_ROOT_PASSWORD" "$DB_USER" "$DB_PASSWORD" "$SESSION_SECRET" > "$secret_file"

          kubectl create secret generic app-secrets \
            --namespace "$KUBERNETES_NAMESPACE" \
            --from-env-file="$secret_file" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply development manifests
        run: kubectl apply -k kubernetes/overlays/dev

      - name: Wait for MySQL storage and startup
        run: kubectl rollout status statefulset/mysql --namespace "$KUBERNETES_NAMESPACE" --timeout=600s

      - name: Pull the latest Jenkins images
        run: |
          kubectl rollout restart deployment/auth-service deployment/roadmap-service deployment/frontend \
            --namespace "$KUBERNETES_NAMESPACE"
          kubectl rollout status deployment/auth-service --namespace "$KUBERNETES_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/roadmap-service --namespace "$KUBERNETES_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/frontend --namespace "$KUBERNETES_NAMESPACE" --timeout=300s

      - name: Show deployed resources
        run: |
          kubectl get deployments,statefulsets,services,pods --namespace "$KUBERNETES_NAMESPACE"
