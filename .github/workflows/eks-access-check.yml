name: EKS deployment access check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-eks-access:
    name: Verify GitHub Actions access to EKS
    runs-on: [self-hosted, linux, x64]
    env:
      AWS_REGION: eu-north-1
      EKS_CLUSTER_NAME: ivolve-x-dev
      KUBERNETES_NAMESPACE: ivolve

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure EKS access
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Verify namespace deployment permissions
        run: |
          kubectl get deployments --namespace "$KUBERNETES_NAMESPACE"
          kubectl auth can-i create deployments --namespace "$KUBERNETES_NAMESPACE"
          kubectl auth can-i patch deployments --namespace "$KUBERNETES_NAMESPACE"
