---
plugin: amazon.aws.aws_ec2
regions:
  - eu-north-1
filters:
  instance-state-name: running
  tag:Project: ivolve-x
  tag:Environment: dev
  tag:Name: ivolve-x-dev-jenkins
hostnames:
  - instance-id
compose:
  ansible_host: public_ip_address
groups:
  jenkins: "tags.get('Name', '') == 'ivolve-x-dev-jenkins'"
strict: true
