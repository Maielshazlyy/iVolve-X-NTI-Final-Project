---
- name: Configure the development Jenkins EC2 host
  hosts: jenkins
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require an Ubuntu host
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: "This playbook currently supports the Ubuntu Jenkins EC2 host."

    - name: Require an SSH key path from the environment
      ansible.builtin.assert:
        that:
          - lookup('env', 'ANSIBLE_PRIVATE_KEY_FILE') | length > 0
        fail_msg: "Set ANSIBLE_PRIVATE_KEY_FILE to the private key path on the Ansible control host."
      delegate_to: localhost
      become: false

  roles:
    - java
    - jenkins
    - docker
    - trivy
