---
- name: Install Jenkins repository signing key
  ansible.builtin.get_url:
    url: "{{ jenkins_lts_repo_key_url }}"
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: "0644"

- name: Configure Jenkins LTS apt repository
  ansible.builtin.apt_repository:
    repo: "{{ jenkins_lts_repo }}"
    filename: jenkins
    state: present
    update_cache: true

- name: Install Jenkins LTS
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true

- name: Enable and start Jenkins
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: true

- name: Wait for Jenkins HTTP endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/login
    status_code: 200
  register: jenkins_http
  retries: 20
  delay: 6
  until: jenkins_http.status == 200
