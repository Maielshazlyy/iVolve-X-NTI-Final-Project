services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_DATABASE: ${DB_NAME:-ivolve}
      MYSQL_USER: ${DB_USER:?Set DB_USER in docker/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-service:
    build:
      context: ../app/auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ivolve}
      DB_USER: ${DB_USER:?Set DB_USER in docker/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  roadmap-service:
    build:
      context: ../app/roadmap-service
    restart: unless-stopped

  frontend:
    build:
      context: ../app/frontend
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:5000
      ROADMAP_SERVICE_URL: http://roadmap-service:8080
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in docker/.env}
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      roadmap-service:
        condition: service_started

volumes:
  mysql-data:
