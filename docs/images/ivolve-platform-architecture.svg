<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">IVOLVE NTI cloud DevOps project architecture</title>
  <desc id="desc">Terraform and Ansible provision and configure the AWS platform. Jenkins builds and scans service images on a Docker agent, pushes images to ECR, and commits immutable image tags to GitHub. GitHub Actions runs on a self-hosted runner on the Jenkins EC2 host and deploys the Kubernetes overlay to EKS. An internet-facing ALB serves the frontend, which calls the Auth and Roadmap services; Auth persists users to MySQL on EBS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#111d35"/></linearGradient>
    <linearGradient id="aws" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182842"/><stop offset="1" stop-color="#122035"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8db8ff"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#71ddb0"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eef4ff} .title{font-size:34px;font-weight:700}.subtitle{font-size:16px;fill:#a9bbd5}
      .section{font-size:16px;font-weight:700;letter-spacing:1px;fill:#91baff}.card{fill:#16243a;stroke:#385271;stroke-width:1.5}.card2{fill:#1a2d47;stroke:#5075a5;stroke-width:1.5}
      .head{font-size:20px;font-weight:700}.body{font-size:15px;fill:#c5d2e4}.small{font-size:13px;fill:#9fb4ce}.tag{font-size:12px;font-weight:700;fill:#071426}
      .flow{fill:none;stroke:#8db8ff;stroke-width:3;marker-end:url(#arrow)}.deploy{fill:none;stroke:#71ddb0;stroke-width:3;marker-end:url(#arrowGreen)}
      .dash{fill:none;stroke:#5d7798;stroke-width:1.5;stroke-dasharray:8 8}.lane{fill:#0e1a2d;stroke:#2d4564;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1800" height="1160" rx="24" fill="url(#bg)"/>
  <text x="54" y="62" class="title">IVOLVE × NTI | Cloud DevOps delivery architecture</text>
  <text x="56" y="92" class="subtitle">Local development → Infrastructure as Code → CI → image registry → automated EKS deployment → browser</text>

  <rect x="48" y="122" width="1704" height="300" rx="18" class="lane"/>
  <text x="74" y="155" class="section">SOURCE CONTROL &amp; CONTINUOUS INTEGRATION</text>

  <rect x="78" y="190" width="260" height="155" rx="14" class="card"/>
  <text x="104" y="226" class="head">GitHub repository</text>
  <text x="104" y="256" class="body">Application source</text>
  <text x="104" y="280" class="body">Kubernetes manifests</text>
  <text x="104" y="304" class="body">Jenkinsfiles + workflows</text>
  <rect x="104" y="318" width="106" height="20" rx="10" fill="#79aaff"/><text x="117" y="333" class="tag">main branch</text>

  <rect x="424" y="190" width="300" height="155" rx="14" class="card2"/>
  <text x="450" y="226" class="head">Jenkins controller</text>
  <text x="450" y="256" class="body">Terraform-managed EC2</text>
  <text x="450" y="280" class="body">Three service pipelines</text>
  <text x="450" y="304" class="body">Trusted Groovy Shared Library</text>
  <text x="450" y="328" class="small">Ansible installs/configures Jenkins</text>

  <rect x="802" y="190" width="300" height="155" rx="14" class="card"/>
  <text x="828" y="226" class="head">Docker build agent</text>
  <text x="828" y="256" class="body">Docker Desktop container</text>
  <text x="828" y="280" class="body">Docker CLI + Trivy + AWS CLI</text>
  <text x="828" y="304" class="body">Builds and scans each service</text>
  <text x="828" y="328" class="small">Inbound WebSocket to Jenkins EC2</text>

  <rect x="1180" y="190" width="245" height="155" rx="14" class="card2"/>
  <text x="1206" y="226" class="head">Amazon ECR</text>
  <text x="1206" y="256" class="body">Private service repos</text>
  <text x="1206" y="280" class="body">frontend · auth · roadmap</text>
  <text x="1206" y="304" class="body">Scans on image push</text>
  <text x="1206" y="328" class="small">Build-number image references</text>

  <path d="M338 260 H414" class="flow"/><text x="342" y="246" class="small">SCM checkout</text>
  <path d="M724 260 H792" class="flow"/><text x="726" y="246" class="small">remote build</text>
  <path d="M1102 260 H1170" class="flow"/><text x="1106" y="246" class="small">scan + push</text>
  <path d="M574 345 V385 H208 V354" class="flow"/><text x="298" y="379" class="small">Push updated manifest using Jenkins GitHub credential</text>

  <rect x="48" y="452" width="1704" height="650" rx="18" fill="url(#aws)" stroke="#54739b" stroke-width="2"/>
  <text x="76" y="489" class="section">AWS CLOUD | eu-north-1</text>

  <rect x="80" y="524" width="280" height="148" rx="14" class="card"/>
  <text x="106" y="560" class="head">Terraform + S3 state</text>
  <text x="106" y="590" class="body">VPC, subnets, NAT, ACLs</text>
  <text x="106" y="614" class="body">EKS, ECR, Jenkins, IAM</text>
  <text x="106" y="638" class="small">Encrypted/versioned remote state</text>

  <rect x="80" y="714" width="280" height="142" rx="14" class="card"/>
  <text x="106" y="750" class="head">Ansible control host</text>
  <text x="106" y="780" class="body">Dynamic EC2 inventory</text>
  <text x="106" y="804" class="body">Java 21 · Docker · Trivy</text>
  <text x="106" y="828" class="small">Configures Jenkins EC2 over SSH</text>

  <path d="M360 590 H415 V263 H414" class="dash" marker-end="url(#arrow)"/>
  <path d="M360 785 H394 V320 H424" class="dash" marker-end="url(#arrow)"/>

  <rect x="424" y="524" width="1275" height="525" rx="20" fill="#0e1b2c" stroke="#6e8caf" stroke-width="2"/>
  <text x="450" y="558" class="section">VPC 10.40.0.0/16 | public and private subnets across two AZs</text>

  <rect x="450" y="584" width="365" height="178" rx="14" class="card"/>
  <text x="476" y="620" class="head">Jenkins EC2 host</text>
  <text x="476" y="650" class="body">Jenkins controller :8080</text>
  <text x="476" y="674" class="body">Self-hosted GitHub Actions runner</text>
  <text x="476" y="698" class="body">Instance role for ECR publishing</text>
  <text x="476" y="730" class="small">Restricted SSH/UI CIDRs</text>

  <rect x="450" y="804" width="365" height="152" rx="14" class="card2"/>
  <text x="476" y="840" class="head">GitHub Actions runner</text>
  <text x="476" y="870" class="body">Self-hosted Linux x64 service</text>
  <text x="476" y="894" class="body">AWS CLI · kubectl · VPC access</text>
  <text x="476" y="928" class="small">Applies manifests to private EKS API</text>

  <rect x="862" y="584" width="300" height="372" rx="14" class="card"/>
  <text x="888" y="620" class="head">EKS control plane</text>
  <text x="888" y="650" class="body">ivolve-x-dev</text>
  <text x="888" y="674" class="body">Private + CIDR-limited public API</text>
  <line x1="888" y1="700" x2="1136" y2="700" stroke="#3e5878"/>
  <text x="888" y="732" class="head">Private node group</text>
  <text x="888" y="762" class="body">Two Ready t3.small workers</text>
  <text x="888" y="786" class="body">EBS CSI + Pod Identity</text>
  <text x="888" y="826" class="body">Auth API pod</text>
  <text x="888" y="850" class="body">Roadmap API pod</text>
  <text x="888" y="874" class="body">Frontend pod</text>
  <text x="888" y="898" class="body">MySQL StatefulSet + gp3 PVC</text>
  <text x="888" y="932" class="small">All workloads in namespace ivolve</text>

  <rect x="1208" y="584" width="455" height="152" rx="14" class="card2"/>
  <text x="1234" y="620" class="head">Public subnet · Application Load Balancer</text>
  <text x="1234" y="650" class="body">AWS Load Balancer Controller + Ingress</text>
  <text x="1234" y="674" class="body">HTTP :80 → frontend ClusterIP Service</text>
  <text x="1234" y="708" class="small">Health checks route traffic to ready frontend pods</text>

  <rect x="1208" y="804" width="455" height="152" rx="14" class="card"/>
  <text x="1234" y="840" class="head">Browser / project user</text>
  <text x="1234" y="870" class="body">Open ALB DNS address over HTTP</text>
  <text x="1234" y="894" class="body">Sign up → login → view roadmap</text>
  <text x="1234" y="928" class="small">Frontend calls Auth and Roadmap services internally</text>

  <path d="M338 260 C380 260 385 600 424 600" class="flow"/>
  <path d="M724 275 C770 275 770 300 802 300" class="flow"/>
  <path d="M1020 345 V490 H1320 V514" class="deploy"/>
  <text x="1080" y="478" class="small">GitHub Actions manifest trigger</text>
  <path d="M815 880 H850" class="deploy"/><text x="817" y="864" class="small">kubectl apply -k</text>
  <path d="M1162 665 H1198" class="flow"/><text x="1164" y="650" class="small">Ingress</text>
  <path d="M1208 680 C1185 680 1184 810 1150 820" class="flow"/>
  <path d="M1208 872 H1172" class="flow"/><text x="1176" y="858" class="small">HTTP :80</text>

  <rect x="78" y="1000" width="1580" height="48" rx="12" fill="#0a1424" stroke="#263c59"/>
  <circle cx="108" cy="1024" r="7" fill="#8db8ff"/><text x="124" y="1030" class="small">CI / source flow</text>
  <circle cx="300" cy="1024" r="7" fill="#71ddb0"/><text x="316" y="1030" class="small">Deployment flow</text>
  <circle cx="510" cy="1024" r="7" fill="#a5b7d0"/><text x="526" y="1030" class="small">Infrastructure provisioning/configuration (dashed)</text>
  <text x="1090" y="1030" class="small">EKS / NAT / EC2 / ALB / EBS may incur AWS charges</text>
</svg>
