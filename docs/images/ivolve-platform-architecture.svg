<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">iVolve and NTI cloud DevOps architecture</title>
  <desc id="desc">GitHub Actions builds, scans, and pushes immutable service images to ECR, then commits updated image references. Argo CD watches Git and synchronizes Kubernetes resources into Amazon EKS. Terraform provisions AWS. EKS hosts the application and MySQL with EBS storage; an AWS ALB exposes the frontend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081120"/><stop offset="1" stop-color="#14243b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75aaff"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5fdaa6"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eff5ff}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#8fa5c2}.section{font-size:20px;font-weight:700;fill:#75aaff;letter-spacing:1px}.head{font-size:21px;font-weight:700}.body{font-size:18px;fill:#bfcfe4}.small{font-size:15px;fill:#8fa5c2}.panel{fill:#101d31;stroke:#2c4462;stroke-width:2}.card{fill:#17273f;stroke:#354f6f;stroke-width:2}.card2{fill:#1b304c;stroke:#466183;stroke-width:2}.arrow{fill:none;stroke:#75aaff;stroke-width:4;marker-end:url(#arrow)}.deploy{fill:none;stroke:#5fdaa6;stroke-width:4;marker-end:url(#green)}</style>
  </defs>
  <rect width="1600" height="1060" rx="24" fill="url(#bg)"/>
  <text x="54" y="68" class="title">iVolve × NTI | Cloud DevOps Architecture</text>
  <text x="57" y="108" class="sub">GitHub Actions owns CI · Argo CD owns CD · Terraform provisions AWS</text>
  <rect x="42" y="142" width="1516" height="314" rx="22" class="panel"/>
  <text x="70" y="180" class="section">SOURCE CONTROL &amp; CONTINUOUS INTEGRATION</text>
  <rect x="76" y="207" width="300" height="190" rx="18" class="card"/><image href="../demo/assets/logos/rasterized/github.png" x="98" y="228" width="38" height="38"/><text x="150" y="258" class="head">GitHub repository</text><text x="100" y="316" class="body">Application source</text><text x="100" y="348" class="body">Kubernetes manifests</text><text x="100" y="380" class="body">main branch desired state</text>
  <rect x="434" y="207" width="330" height="190" rx="18" class="card2"/><image href="../demo/assets/logos/rasterized/github.png" x="456" y="228" width="38" height="38"/><text x="508" y="258" class="head">GitHub Actions · CI</text><text x="458" y="316" class="body">Hosted runner builds services</text><text x="458" y="348" class="body">Trivy scans container images</text><text x="458" y="380" class="body">Immutable commit SHA tags</text>
  <rect x="822" y="207" width="300" height="190" rx="18" class="card"/><image href="../demo/assets/logos/aws/ecr.png" x="844" y="228" width="38" height="38"/><text x="896" y="258" class="head">Amazon ECR</text><text x="846" y="316" class="body">Private repositories</text><text x="846" y="348" class="body">frontend · auth · roadmap</text><text x="846" y="380" class="body">Commit tagged images</text>
  <rect x="1180" y="207" width="330" height="190" rx="18" class="card"/><image href="../demo/assets/logos/rasterized/github.png" x="1202" y="228" width="38" height="38"/><text x="1254" y="258" class="head">Manifest update</text><text x="1204" y="316" class="body">CI commits image references</text><text x="1204" y="348" class="body">Argo CD watches this branch</text><text x="1204" y="380" class="body">No workflow kubectl deploy</text>
  <path d="M376 302H423M764 302H811M1122 302H1169" class="arrow"/>
  <rect x="42" y="490" width="1516" height="510" rx="22" fill="#14243b" stroke="#426186" stroke-width="2"/><text x="70" y="530" class="section">AWS CLOUD · eu-north-1</text>
  <rect x="76" y="568" width="330" height="180" rx="18" class="card"/><image href="../demo/assets/logos/rasterized/terraform.png" x="98" y="590" width="38" height="38"/><text x="150" y="620" class="head">Terraform + S3</text><text x="100" y="678" class="body">VPC · subnets · NAT · ACLs</text><text x="100" y="710" class="body">EKS · ECR · IAM · remote state</text>
  <rect x="76" y="782" width="330" height="160" rx="18" class="card"/><image href="../demo/assets/logos/aws/ecr.png" x="98" y="804" width="38" height="38"/><text x="150" y="834" class="head">CI identity</text><text x="100" y="882" class="body">Existing IAM user, ECR push only</text><text x="100" y="914" class="body">No EKS deployment access</text>
  <rect x="452" y="550" width="1068" height="390" rx="20" fill="#0c192a" stroke="#5a799e" stroke-width="2"/><text x="480" y="590" class="section">VPC · TWO AVAILABILITY ZONES</text>
  <rect x="492" y="628" width="338" height="230" rx="18" class="card2"/><image href="../demo/assets/logos/rasterized/kubernetes.png" x="514" y="650" width="38" height="38"/><text x="566" y="680" class="head">Amazon EKS</text><text x="516" y="738" class="body">ivolve-x-dev · two workers</text><text x="516" y="770" class="body">Argo CD watches Git desired state</text><text x="516" y="802" class="body">Argo CD syncs the dev overlay</text><text x="516" y="834" class="body">Namespace: ivolve</text>
  <rect x="866" y="628" width="278" height="230" rx="18" class="card"/><image href="../demo/assets/logos/aws/elb.png" x="888" y="650" width="38" height="38"/><text x="940" y="680" class="head">Public ALB</text><text x="890" y="738" class="body">Load Balancer Controller</text><text x="890" y="770" class="body">Ingress routes HTTP to</text><text x="890" y="802" class="body">frontend ClusterIP service</text>
  <rect x="1180" y="628" width="290" height="230" rx="18" class="card"/><image href="../../app/frontend/public/images/ivolve-logo.png" x="1202" y="650" width="38" height="38"/><text x="1254" y="680" class="head">Application</text><text x="1204" y="738" class="body">Frontend + Auth API</text><text x="1204" y="770" class="body">Roadmap API + MySQL</text><text x="1204" y="802" class="body">MySQL data on gp3 EBS</text>
  <path d="M830 744H855M1144 744H1169" class="deploy"/><path d="M1320 397V470" class="deploy"/>
  <text x="58" y="1042" class="head">CODE CHANGE → BUILD + SCAN → ECR → GIT MANIFEST → ARGO CD SYNC → EKS</text>
</svg>
