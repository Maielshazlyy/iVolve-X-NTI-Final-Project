services:
  ivolve-build-agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    container_name: ivolve-build-agent
    restart: unless-stopped
    environment:
      JENKINS_URL: ${JENKINS_URL:?Set JENKINS_URL to the Jenkins controller URL}
      JENKINS_SECRET: ${JENKINS_SECRET:?Set JENKINS_SECRET in jenkins/.env}
      JENKINS_AGENT_NAME: ivolve-build-agent
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
