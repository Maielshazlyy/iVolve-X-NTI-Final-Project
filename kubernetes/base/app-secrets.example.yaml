# Template only. Do not apply this file or put real credentials in Git.
# GitHub Actions creates/updates the live app-secrets Secret from repository secrets.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ivolve
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: REPLACE_WITH_GITHUB_SECRET
  DB_USER: REPLACE_WITH_GITHUB_SECRET
  DB_PASSWORD: REPLACE_WITH_GITHUB_SECRET
  SESSION_SECRET: REPLACE_WITH_GITHUB_SECRET
