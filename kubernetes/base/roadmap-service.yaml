apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roadmap-service
  template:
    metadata:
      labels:
        app: roadmap-service
    spec:
      containers:
        - name: roadmap-service
          image: 335452653010.dkr.ecr.eu-north-1.amazonaws.com/ivolve-x/dev/roadmap-service:a57004061fe5d19c433a9fdfc71895945dcfb935-2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/roadmap
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: roadmap-service
spec:
  type: ClusterIP
  selector:
    app: roadmap-service
  ports:
    - name: http
      port: 8080
      targetPort: http
